name: 简报配置检查
on:
  push:
    branches: [main]
    paths: ['.github/workflows/brief-config-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    environment: STOCK_LIST
    timeout-minutes: 5
    steps:
      - name: 检查必需配置（不显示密钥）
        env:
          STOCK_LIST: ${{ vars.STOCK_LIST || secrets.STOCK_LIST }}
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER || secrets.EMAIL_SENDER }}
          EMAIL_RECEIVERS: ${{ vars.EMAIL_RECEIVERS || secrets.EMAIL_RECEIVERS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || secrets.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIHUBMIX_KEY: ${{ secrets.AIHUBMIX_KEY }}
          MODELFLARE_KEY: ${{ secrets.MODELFLARE_KEY }}
          LLM_PRIMARY_API_KEY: ${{ secrets.LLM_PRIMARY_API_KEY }}
          LLM_CHANNELS: ${{ vars.LLM_CHANNELS || secrets.LLM_CHANNELS }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_CONFIG_YAML: ${{ vars.LITELLM_CONFIG_YAML || secrets.LITELLM_CONFIG_YAML }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
          ANSPIRE_API_KEYS: ${{ secrets.ANSPIRE_API_KEYS }}
          BOCHA_API_KEYS: ${{ secrets.BOCHA_API_KEYS }}
          BRAVE_API_KEYS: ${{ secrets.BRAVE_API_KEYS }}
        run: |
          python - <<'PY'
          import os, re, json
          names = ["EMAIL_PASSWORD","DEEPSEEK_API_KEY","OPENAI_API_KEY","OPENAI_BASE_URL","OPENAI_MODEL","GEMINI_API_KEY","ANTHROPIC_API_KEY","AIHUBMIX_KEY","MODELFLARE_KEY","LLM_PRIMARY_API_KEY","LLM_CHANNELS","LITELLM_API_KEY","LITELLM_CONFIG_YAML","TAVILY_API_KEYS","SERPAPI_API_KEYS","ANSPIRE_API_KEYS","BOCHA_API_KEYS","BRAVE_API_KEYS"]
          status = {key: bool(os.getenv(key,"").strip()) for key in names}
          stock_list = re.split(r"[,，、;；\\s]+", os.getenv("STOCK_LIST","").strip())
          stocks = {s for s in stock_list if s}
          expected = {"300006","002748","002264","603968","605168","688338","000690","000722","002317","002437","603318","600403","002041"}
          status["stock_count"] = len(stocks)
          status["watchlist_matches_latest_html"] = stocks == expected
          status["sender_matches_requested"] = os.getenv("EMAIL_SENDER","").strip() == "632402699@qq.com"
          status["recipient_matches_requested"] = "2403028333@qq.com" in [s.strip() for s in os.getenv("EMAIL_RECEIVERS","").split(",")]
          print("CONFIG_CHECK=" + json.dumps(status, ensure_ascii=False))
          PY
